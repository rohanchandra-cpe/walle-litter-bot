# Route follower settings (walle-app/route/route_follower.py). Phase 1 plan:
# docs/plans/phase-1-plan.md. Speeds are what the follower COMMANDS; with the current
# open-loop firmware (MIN_DUTY 0.40) the robot drives faster than commanded at low speeds.

feedback_topic: /odometry/filtered   # the EKF (wheels + BNO055); /wheel/odom = wheels alone
command_rate_hz: 20                  # Twist messages per second (the Pico stops after 500 ms)
status_topic: /walle/route/status    # std_msgs/String JSON progress

laps: 1
dwell_s: 15.0                # wait at each bin, facing it
face_bins: true

side:                        # following a side from corner to corner
  # Forward speed = gain x distance left, clamped (the RQ1-B stopping rule, pilot.yaml)
  min_speed_mps: 0.05
  max_speed_mps: 0.15
  speed_gain: 1.5
  tolerance_m: 0.005         # stop when this close to the corner (along the side)
  # Steering: aim at side heading - atan(cross_track_gain x cross-track error), and turn
  # toward that heading at heading_gain x error (rad/s per rad), at most max_turn_rps.
  cross_track_gain: 4.0      # 1/m: 2.5 cm off the line -> aim 5.7 deg back toward it
  max_correction_deg: 20.0
  heading_gain: 2.0
  max_turn_rps: 0.5
  timeout_s: 30.0            # a side not finished by then aborts the run
  correct_tol_m: 0.015       # ended farther than this from the corner: creep back/on
  max_corrections: 2

turn:                        # turns in place, to an ABSOLUTE heading (module 8's Mover.turn)
  # Commanded rates. The open-loop firmware turns at about 3 rad/s for any of these
  # (MIN_DUTY 0.40; pilot RQ2), which is why the coast and the corrections matter.
  min_rate_rps: 0.3
  max_rate_rps: 0.6
  tolerance_deg: 1.0
  correct_tol_deg: 3.0       # missed by more than this: turn again
  max_corrections: 2
  settle_s: 0.3              # pause after each move before the next starts

# Coast: after a stop command the robot keeps moving (Wi-Fi, estimate delay, motor
# spin-down), so each move stops early by (measured speed x coast). Starting values from the
# robot: sides 0.2 s (pilot.yaml RQ1-B), turns 0.06 s (module 8 squares). With adapt, each
# move's overshoot updates the coast for the next one (gain x overshoot / speed at the stop).
coast:
  side_s: 0.2
  turn_s: 0.06
  adapt: true
  adapt_gain: 0.5
  max_s: 0.5

# Gyro drift. The EKF heading drifts with the BNO055's gyro bias, also while the robot stands
# still. The follower stands still for start_hold_s before it drives and measures that drift;
# every bin wait adds to the measurement. Then (estimate_bias) it removes the measured drift
# rate from the heading while driving, and after each wait it drops the drift that built up
# during the wait (zero-velocity update), but only if the encoders moved less than
# max_move_m / max_turn_deg, i.e. the robot really stood still.
zero_velocity:
  enabled: true
  estimate_bias: true
  start_hold_s: 10.0
  max_move_m: 0.002
  max_turn_deg: 0.2

log_rate_hz: 10              # trajectory.csv rows per second
camera_url: null             # e.g. http://192.168.1.50/capture: photo at each bin stop
                             # (Gazebo: http://localhost:8080/capture, set by route-check)
results_dir: results/route   # under walle-app/
