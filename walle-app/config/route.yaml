# Route follower settings (walle-app/route/route_follower.py). Phase 1 plan:
# docs/plans/phase-1-plan.md. Speeds are what the follower COMMANDS. Since 2026-11-18 the
# Pico holds them with closed-loop wheel speed control; the old open-loop firmware
# (MIN_DUTY 0.40) drove much faster than commanded at low speeds.

feedback_topic: /odometry/filtered   # the EKF (wheels + BNO055); /wheel/odom = wheels alone
command_rate_hz: 20                  # Twist messages per second (the Pico stops after 500 ms)
status_topic: /walle/route/status    # std_msgs/String JSON progress

laps: 1
dwell_s: 15.0                # wait at each bin, facing it
face_bins: true

side:                        # following a side from corner to corner
  # Forward speed = gain x distance left, clamped (the RQ1-B stopping rule, pilot.yaml)
  # The wheels stick and lurch below about 0.1 m/s each (robot, 2026-11-18), so the slowest
  # approach speed stays near that.
  min_speed_mps: 0.08
  max_speed_mps: 0.15
  speed_gain: 1.5
  tolerance_m: 0.005         # stop when this close to the corner (along the side)
  # Steering: aim at side heading - atan(cross_track_gain x cross-track error), and turn
  # toward that heading at heading_gain x error (rad/s per rad), at most max_turn_rps.
  cross_track_gain: 4.0      # 1/m: 2.5 cm off the line -> aim 5.7 deg back toward it
  max_correction_deg: 20.0
  heading_gain: 2.0
  max_turn_rps: 0.5
  timeout_s: 30.0            # a side not finished by then aborts the run
  correct_tol_m: 0.015       # ended farther than this from the corner: creep back/on
  max_corrections: 2

turn:                        # turns in place, to an ABSOLUTE heading (module 8's Mover.turn)
  # Commanded rates; the closed-loop firmware turns at them (the old open-loop firmware
  # spun at about 3 rad/s for any of them, so corrections overshot by 10-15 deg).
  # 1.0 rad/s = 0.064 m/s per wheel; 0.3-0.6 rad/s (2-4 cm/s per wheel) made the robot
  # fidget: the wheels stuck and lurched (run 20261119_015242).
  min_rate_rps: 1.0
  max_rate_rps: 1.5
  tolerance_deg: 1.0
  correct_tol_deg: 3.0       # missed by more than this: correct it
  max_corrections: 3
  settle_s: 0.3              # pause after each move before the next starts
  # Corrections up to pulse_max_deg are timed PULSES, not slow turns (2026-11-19): asked
  # for 4-6 deg, a slow correction turn stuck, then lurched 8-13 deg (run 20261119_043639).
  # A pulse turns about gain x (duration - dead) deg. The gain is learned from every pulse;
  # a pulse is skipped if even the shortest one would overshoot by more than the error.
  # Starting values measured in walle-sim plastic_pid (0.1 s -> 7 deg, 0.2 s -> 19 deg,
  # 0.3 s -> 29 deg). Bigger misses get a normal turn.
  pulse:
    rate_rps: 1.5
    gain_dps: 110.0
    dead_s: 0.04
    min_s: 0.06
    max_s: 0.30
    adapt_gain: 0.5
  pulse_max_deg: 20.0

# Sensor guard (2026-11-21): over Wi-Fi the Pico's messages can stop for a second or more.
# The EKF then keeps predicting at the last turn rate: robot run 20261121_041923 saw the
# fused heading spin ~300 deg while the wheels stood still, and the follower made a real
# 73 deg pulse at the ghost heading. If /pico/wheel_ticks or /pico/imu/data is older than
# max_age_s, any motion command becomes a stop, and the follower waits until both have
# been fresh for resume_after_s (then it re-reads the pose and carries on), or gives up
# after give_up_s (the run ends). Pulses, centering looks and still periods that saw a gap
# don't feed the learned pulse gain, turn scale or gyro bias. Pulses moving more than
# pulse_outlier x the planned turn don't either.
sensor_guard:
  enabled: true
  max_age_s: 0.4            # the Pico publishes at 50 Hz; above walle-sim's 0.3 s stress bursts
  resume_after_s: 0.6
  give_up_s: 20.0
  pulse_outlier: 2.5
  # Pico restart (ping_seq goes backwards, or the encoder counts jump by more than this in
  # one message; robot run
  # 20261122_142402): stop, wait until the data has been fresh this long, repair the estimate
  # from the wheels. During the start hold: take the start pose again.
  restart_counts: 20000
  restart_settle_s: 2.0
  # Estimate jump: every window_s while moving, the fused estimate may not move more than
  # the wheels by max_extra_m, or turn more by max_extra_deg; else stop and repair from the
  # wheels (that run: 40 cm sideways in 0.5 s while the wheels moved 7 cm).
  jump:
    enabled: true
    window_s: 0.25
    max_extra_m: 0.05
    max_extra_deg: 20.0

# Coast: after a stop command the robot keeps moving (Wi-Fi, estimate delay, motor
# spin-down), so each move stops early by (measured speed x coast). Starting values from the
# robot: sides 0.2 s (pilot.yaml RQ1-B); turns 0.15 s (what the 1.0-1.5 rad/s turns learn in
# walle-sim plastic_pid; module 8's 0.06 s was for its slower open-loop turns). With adapt,
# each move's overshoot updates the coast for the next one (gain x overshoot / speed at stop).
coast:
  side_s: 0.2
  turn_s: 0.15
  adapt: true
  adapt_gain: 0.5
  max_s: 0.5

# Gyro drift. The EKF heading drifts with the BNO055's gyro bias, also while the robot stands
# still. The follower stands still for start_hold_s before it drives and measures that drift;
# every bin wait adds to the measurement. Then (estimate_bias) it removes the measured drift
# rate from the heading while driving, and after each wait it drops the drift that built up
# during the wait (zero-velocity update), but only if the encoders moved less than
# max_move_m / max_turn_deg, i.e. the robot really stood still.
zero_velocity:
  enabled: true
  estimate_bias: true
  start_hold_s: 10.0
  max_move_m: 0.002
  max_turn_deg: 0.2

log_rate_hz: 10              # trajectory.csv rows per second
camera_url: null             # e.g. http://192.168.1.50/capture: photo at each bin stop
camera_timeout_s: 5.0        # per photo request
camera_tries: 3              # tries per bin stop, within the bin wait (a weak 5 V supply
                             # reset the ESP32-CAM mid-run: run 20261119_043639)
camera_retry_gap_s: 3.0      # pause between tries (a rebooting ESP32-CAM needs a few s)
                             # (Gazebo: http://localhost:8080/capture, set by route-check)
results_dir: results/route   # under walle-app/

# Phase 3 (config/detect.yaml): YOLO-World at each bin stop, when there is a camera_url.
# center_bins: before the wait, turn until the detected bin is in the middle of the frame
# (pulses; at most detect.yaml centering.max_offset_deg from the configured heading).
# detect: find items in the bin photo and record them (detections.json, memory store).
# --no-detect turns both off for one run.
detect: true
center_bins: true
# Phase 4 (detect/bin_check.py, config/servo.yaml): after the bin photo, tilt the camera up,
# take a second photo, judge the bin (overflow level, items on top, litter), level the
# camera, and record it (bin_checks.json, memory store). No servo answering: judged on the
# level photo alone. --no-tilt for one run without the servo; false = no bin check.
bin_check: true

# Phase 5 (route/obstacle.py, docs/plans/phase-5-plan.md): obstacles on the sides.
# Before each side, standing on its corner, the camera tilts look_tilt_deg (down) and one
# photo is searched for items in the side's corridor (the strip the body sweeps, grown by
# the item's radius). While driving, the HC-SR04 stops the robot when confirm_pings pings in
# a row are within trigger_m of the sensor and nearer than the end of the current leg (so
# things beyond the corner don't count). Then: look again, record, detour INSIDE the square
# (left of the CCW route): out sideways, past, back to the line (clamped to the corner).
# No way around -> stop, record it as blocked, end the run (status "blocked").
# Robot test 2026-11-22: steady to +-0.5 us at 20-40 cm, the milk jug read 32 cm at ~30 cm;
# a flat bag or paper towel gives no echo (only the camera can find those).
obstacle:
  enabled: true
  look_tilt_deg: -15.0       # camera down for the corner look (clamped to servo.yaml min_deg)
  sensor_forward_m: 0.125    # HC-SR04 face ahead of the axle (robot: below the camera)
  trigger_m: 0.35            # sonar range that stops the robot (from the sensor)
  confirm_pings: 3           # in a row (60 ms each)
  leg_end_slack_m: 0.0
  # Items narrower than this, as seen in the photo, are driven over. 0.04 (user, 2026-11-22,
  # after robot run 20261122_211939 stopped for a ~2 cm speck): specks, pins, a dot of tape.
  # Anything with height is still caught by the sonar.
  min_size_m: 0.04
  # Far positions are unreliable (run 20261122_211939: the cross tape 1.00 m away was placed
  # at 0.69 m; tilt or vertical FOV off). An item the corner look places farther than
  # trust_range_m from the axle is UNCONFIRMED: the robot drives until it is relook_at_m
  # away, looks again, and only that closer look can start a detour. At most max_relooks per
  # side.
  trust_range_m: 0.70
  relook_at_m: 0.60
  max_relooks: 3
  min_radius_m: 0.03         # radius from a box's width is clamped to these
  max_box_radius_m: 0.15
  default_radius_m: 0.10     # radius when only the sonar saw it
  max_radius_m: 0.20         # bigger: no detour, blocked
  assumed_depth_m: 0.25      # a photo can't see how DEEP an object is (a bottle lying along
                             # the path): turn back only this far past its near face (the
                             # tissue box is 24 cm); shrinks to the measured size at a corner
  uncertainty_m: 0.03        # added to every clearance (position error of the estimate)
  max_offset_m: 0.50         # widest detour sideways (inside the 1 m square; keeps >= 0.5 m
                             # from the opposite side). 0.40 refused the flat bag at 0.41 m
                             # (robot run 20261123_040037)
  max_back_past_corner_m: 0.0
  leg_min_m: 0.01
  merge_m: 0.15              # a sonar hit this near a known obstacle (along the side) is it
  max_hits_per_side: 6       # more sonar stops than this on one side: blocked
  sim:                       # walle-sim's Module 6 robot: the sensor is 7 cm ahead
    sensor_forward_m: 0.07
