# Object detection settings (ROADMAP Phase 3, docs/plans/phase-3-plan.md).
# Used by walle-app/detect/detector.py, the route follower's bin stops, and eval_photos.py.
#
# YOLO-World is open-vocabulary: each PROMPT below becomes one class for the model, and every
# prompt maps back to its LABEL and the label's CATEGORY. To recognize a new thing, add a
# label (or a prompt to an existing label); nothing else has to change. A detection whose
# label isn't listed here can't happen, but code that reads detections treats a missing
# category as "unknown".
#
# Labels shared with park.yaml `items` (the simulator's catalog) must have the same category
# there and here (tests/test_detect.py checks this). The simulator's list does not limit
# what the robot can recognize.

model: yolov8s-worldv2.pt     # in walle-app/models/ (downloaded on first use); m = more accurate, ~2.4x slower
imgsz: 640                    # the ESP32-CAM sends 640 x 480
min_conf: 0.25                # item detections below this are dropped (kept in detections.json)
iou: 0.5                      # overlap at which two boxes are the same object
max_latency_s: 1.0            # budget per photo (median); a slower call is logged

bin:
  label: bin
  # Probed alone on the 18 robot bin photos (2026-11-19, bins too close, tops cut off):
  # "black bin" found 11/18 at 0.10 with S (M: 1/18); its best box was on the bin in 16/18
  # even when scored lower. At a bin stop a bin IS there, so a low threshold plus "nearest
  # the expected bearing" picks it. Re-check on the phase-3 photo set (bins at 0.71 m).
  prompts: [black bin, wastebasket, waste bin, trash can]
  min_conf: 0.03
  hint_conf: 0.01             # fainter bin boxes kept in low_conf only (search direction hint)

# The fake trash (user's labels, 2026-11-19). Trash: crumpled paper towels, plastic bags
# (grocery and spinach bags: one label since 2026-11-20, the user's choice). Recycling: aluminum coffee can, milk jug, yogurt container, crumpled foil,
# crumpled Chipotle paper bag. Extras (not in the scored set): carton, tissue box, egg carton.
items:
  paper_towel:      {category: trash,     prompts: [crumpled paper towel, paper towel, tissue paper]}
  plastic_bag:      {category: trash,     prompts: [plastic grocery bag, plastic bag, salad bag]}
  can:              {category: recycling, prompts: [aluminum can, coffee can, tin can]}
  milk_jug:         {category: recycling, prompts: [milk jug, plastic gallon jug]}
  yogurt_container: {category: recycling, prompts: [yogurt container, plastic tub]}
  foil:             {category: recycling, prompts: [crumpled aluminum foil, ball of foil]}
  paper_bag:        {category: recycling, prompts: [crumpled paper bag, brown paper bag]}
  carton:           {category: recycling, prompts: [food carton, broth carton]}
  tissue_box:       {category: recycling, prompts: [tissue box]}
  egg_carton:       {category: recycling, prompts: [egg carton]}
  # also in park.yaml items (the simulator can place these)
  plastic_bottle:   {category: recycling, prompts: [plastic bottle, water bottle]}
  paper_cup:        {category: trash,     prompts: [paper cup, coffee cup]}
  wrapper:          {category: trash,     prompts: [candy wrapper, chip bag]}

# Items by a vision-language model (2026-11-20, plan amendment). YOLO-World named 0/36 items
# on the night photos and, with generic prompts, still missed most of them; gemma4 found
# and boxed foil, towels and bags on the whole photo. method: vlm = YOLO-World finds the
# BIN, the VLM finds and names the ITEMS; yolo = YOLO-World alone (the original plan).
method: vlm
vlm:
  model: qwen3.5:4b           # 2026-11-20: beat gemma4 on shots 1-29 (recall 0.70 vs 0.58), same speed
  url: null                   # null = OLLAMA_URL, else http://host.docker.internal:11434
  timeout_s: 120
  # How each model family orders a box's 0-1000 numbers (matched on the model name's start):
  # gemma [ymin, xmin, ymax, xmax]; qwen [xmin, ymin, xmax, ymax] whatever the prompt asks.
  box_order: {default: yxyx, qwen: xyxy}
  # Second FIND on a zoomed crop over the biggest bin's rim (items on top were missed most).
  # Window, in bin-box sizes: `above` its top edge, `below` it (the rim), `side` each way.
  # Only in good light (2026-11-21). Same on-bin setups: daylight 0.73 -> 0.93 recall with the
  # zoom; under the room lamps 0.75 -> 0.56 (the zoomed crop is dim and noisy, items misnamed).
  # Good light = the photo's color cast, mean red minus mean blue, at most max_warm_cast: the
  # lamp photos measure 11-22, the daylight ones 2-7. This tells the user's warm lamps from
  # daylight; it is not a general darkness measure (a white LED lamp would pass).
  zoom_bin_top: {enabled: true, max_warm_cast: 9.0, above: 1.0, below: 0.3, side: 0.25,
                 min_side: 448}
  # What the model is told each label looks like (it answers with the label).
  describe:
    paper_towel: crumpled white paper towel or tissue
    plastic_bag: plastic film bag (grocery bag with handles, or a clear / printed salad or spinach bag)
    can: metal drink or coffee can
    milk_jug: plastic milk jug (gallon)
    yogurt_container: white plastic yogurt tub or cup, with or without its lid
    foil: crumpled aluminum foil (shiny silver)
    paper_bag: crumpled brown paper takeout bag (printed)
    carton: food or broth carton (paperboard box)
    tissue_box: tissue box
    egg_carton: gray molded-pulp egg carton
    plastic_bottle: plastic bottle
    paper_cup: paper cup
    wrapper: candy wrapper or chip bag

# Simulator (source sim). YOLO-World sees nothing in the park world: its bins and items are
# flat-colored boxes and cylinders, and no prompt scored above 0.05 on Gazebo photos, not even
# a bin filling the frame (2026-11-19). So in Gazebo the follower uses detect/sim_truth.py, a
# ground-truth stand-in that projects the true bins and items into the camera; the code after
# the model is the same. Accuracy is judged on real photos only (decided with the user).
sim:
  camera:                     # the walle-sim camera (urdf/gazebo_car.urdf.xacro), over park.yaml's
    height_m: 0.10
    forward_m: 0.07
    left_m: 0.0
    vertical_fov_deg: 46.8
  centering:                  # over centering: below, in Gazebo
    turn_scale: 1.0

# Bin centering at each bin stop (route follower, between face_bin and dwell).
centering:
  tolerance_deg: 3.0          # bin center within this of the image center: done
  max_corrections: 3
  max_offset_deg: 25.0        # never turn farther than this from the configured bin heading
  edge_px: 4                  # a box this close to the frame edge is cut off there
  min_overlap: 0.3            # item over a bin: at least this much of its width over the bin's box
  min_size_frac: 0.5          # a bin box smaller than this x the expected bin size is not the bin
  # No bin on a look: try search_deg each side of the configured heading (the side where a
  # bin-tall box is cut off at the frame edge first), before giving up. 0 = no search.
  search_deg: 15.0
  # Turning to the bin: the camera sees it move parallax x turn_scale x the turn the EKF
  # records (parallax from the camera being ahead of the axle). turn_scale is learned from
  # each pair of looks; this is where it starts. Robot run 20261121_000650: ~1.37 (short
  # pulses turn more than the EKF records 0.3 s later). The sim starts at 1.0 (sim: below).
  turn_scale: 1.35
  turn_scale_limits: [0.7, 2.5]
  turn_scale_gain: 0.6        # how far each new measurement moves the learned value

place:
  rim_margin_px: 8            # an item whose bottom is above the bin box's top + this is on_bin
  max_ground_range_m: 3.0     # farther ground-plane estimates are dropped (obj_xy = none)

# Phase 3 targets on the labeled ESP32-CAM set (data/photos/phase3/, agreed 2026-11-19).
# detect/eval_photos.py prints PASS only if all are met.
eval:
  recall: 0.80                # true items found (matched by label and count per photo)
  precision: 0.80             # reported items that are real
  category: 0.90              # trash/recycling right, of the items found (by category count)
  bin_found: 0.95             # photos with a bin in which a bin is detected
  latency_median_s: 15.0      # was 1.0 (YOLO-World alone); 2026-11-20 the user put accuracy first (VLM); confirmed by the user
  bin_distance_m: 0.755       # camera to bin center at a bin stop (0.88 - 0.125), for bin_shift_cm bearings

# The bin check (ROADMAP Phase 4, detect/bin_check.py): from the level photo (litter) and
# the up photo (camera tilted servo.yaml up_deg: what is above the rim). The bins are opaque:
# no fill level. overflow_level = the larger of the two levels below, at most 3.
bin_check:
  # items seen on top -> level 1, 2, 3 (the sim's mounds: 3, 6 and 10 items, park.py)
  count_levels: [1, 4, 7]
  # the highest item's top this far above the rim -> level 1, 2, 3 (null = not by height).
  # OFF: measured over 40 random mounds per level x 4 bins (2026-11-21, robot camera at
  # 15 deg up), the top's height above the rim overlaps between levels: level 1 6.9-13.9 cm,
  # level 2 10.2-17.6, level 3 13.2-20.5. The counts don't: 2-3, 5-6, 9-10 items seen. The
  # height is still recorded (top_height_above_rim_m); revisit with the robot's bins.
  height_levels_m: [null, null, null]
  # floor items (around_bin, with a ground point) within this of the bin's sides count as
  # litter; farther ones (bin 2's clutter by the wall) are kept in the record, not counted
  litter_radius_m: 0.40
  min_conf: 0.0
  # The photos at a bin stop after centering (robot run 20261122_134315, user-approved fixes):
  pick_max_offset_deg: 12.0     # the bin box must be this near straight ahead (a Ziploc box
                                # beside bin 4 was taken for the bin)
  low_conf_max_offset_deg: 8.0  # with no bin box, a faint one (low_conf) this near is the bin
                                # (bin 3's up photo: 0.025)
  on_top_max_gap_m: 0.10        # an item on top rests on the rim: its bottom at most this
                                # above it (a background speck 35 cm up was "on bin 1")
  rim_margin_frac: 0.12         # an item on top may hang this share of the bin box's height
                                # below its top edge (soft items drape over the rim: three
                                # scenes, 2026-11-22); at least place.rim_margin_px
