# Phase 3 labeled photo set: the shot list (ROADMAP Phase 3, docs/plans/phase-3-plan.md).
# Shots 1-42 taken 2026-11-19/20 (1-29 night, 30-42 day); 43-52 are daylight repeats.
#
# Take every photo with the robot's ESP32-CAM, never a phone. Power only the 5 V side (Pico
# + camera) so the motors can't move. Then, from the repository root on the host:
#
#     python3 walle-app/detect/capture_set.py --camera-url http://192.168.1.201/capture
#
# It walks through these shots, saves shot_NN.jpg here, and writes labels.yaml from this
# list. If what you placed differs from a shot, edit that shot's entry in labels.yaml.
#
# WHERE THE ROBOT SITS
#   corner: on the bin's corner of the taped square, facing the bin, as at a bin stop. The
#           bin's center is 0.88 m out on the corner's diagonal, measured from the CORNER
#           (the robot's axle), not the camera (`python3 walle-app/park.py` prints the
#           positions); its wide face toward the square. Bin center to camera ~0.755 m.
#   route:  on the tape line, facing along the side; items 30-60 cm ahead of the camera.
#   carpet: on the carpet off the mat, facing away from the square.
#
# PLACES (the label for each item)
#   on_bin:     on top of the bin, resting on the rim or sticking up out of it, so the camera
#               sees it ABOVE the rim. The bins are 29 cm tall: put something inside to raise
#               an item if it would sink below the rim.
#   around_bin: on the floor next to or in front of the bin.
#   route:      on the floor with no bin in view.
#
# bin_shift_cm: slide the bin sideways along its wide face by this much, measured with a
# tape (+ = to the robot's left, - = to its right). At 0.755 m, 13.3 cm = 10 deg and
# 27.5 cm = 20 deg: these shots measure the lens's angle and check the bin's bearing.
# If the room can't fit 0.88 m, tell Claude the distance used: these shifts change with it.
#
# ITEMS. Trash: paper_towel (crumpled paper towels), plastic_bag (grocery bag with handles, or a
# spinach bag: one label since 2026-11-20). Recycling: can (aluminum coffee can), milk_jug, yogurt_container (with lid),
# foil (crumpled aluminum foil), paper_bag (crumpled Chipotle bag).
# Every item must be wholly in the frame unless the shot says otherwise.

