# Phase 4 labeled photo set (ROADMAP Phase 4, item accuracy carried over from Phase 3).
# DRAFT 2026-11-21: to agree with the user before taking it.
#
# The same on-bin and around-bin setups as Phase 3 (shots 7-14, 15, 17, 25, 28), each taken
# twice from the bin stop: a LEVEL look (tilt 0) and an UP look (tilt 15 deg, servo.yaml
# up_deg), in daylight and under the room lamps: 12 setups x 2 looks x 2 lights = 48 shots.
# eval_photos.py scores an up look on the items ON the bin and a level look on the items on
# the FLOOR, exactly as the bin check uses them:
#
#     docker exec walle-pilot bash -lc "cd /workspace && python3 walle-app/detect/eval_photos.py \
#         --set-dir walle-app/data/photos/phase4 --by-light"        # then again with --zoom
#
# HOW TO TAKE IT
#   - Robot side up (`make up`, `make launch`): the camera servo needs the Pico. Nothing sends
#     /pico/cmd_vel, so the wheels stay still (the Pico's 500 ms watchdog).
#   - The robot sits on the bin's corner facing the bin, as at a bin stop (bin center 0.88 m
#     out on the corner's diagonal from the corner; park.py prints the positions).
#   - From the host:
#       python3 walle-app/detect/capture_set.py --camera-url http://192.168.1.201/capture \
#           --set-dir walle-app/data/photos/phase4 --light day      # (later: --light night)
#     Before each shot it prints the servo command to run in a container shell
#     (`make shell`), e.g. python3 /workspace/walle-app/servo/servo_test.py --deg 15 --stay
#   - Place the items once per setup; take its level shot, tilt, take its up shot.
#
# PLACES: as in phase3/shots.yaml (on_bin = on top of the bin, seen above the rim;
# around_bin = on the floor next to or in front of the bin, where the robot can see it).

